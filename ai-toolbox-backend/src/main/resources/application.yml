spring:
  application:
    name: ai-toolbox-backend

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/ai_toolbox?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

  

# MyBatis-Plus配置
#mybatis-plus:
