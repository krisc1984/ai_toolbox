#  type-aliases-package: com.aitoolbox.entity
#  global-config:
#    db-config:
#      id-type: auto
#      logic-delete-field: deleted
#      logic-delete-value: 1
#      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ai_toolbox_secret_key_for_jwt_token
  expiration: 86400000

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
  http2:
    enabled: true

# 日志配置
logging:
  level:
    com.aitoolbox: debug
  file:
    name: logs/ai-toolbox.log
